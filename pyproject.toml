[project]
name = "pycharmai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3",
    "anthropic[bedrock]",
    "langgraph",
    "langchain",
    "langchain-anthropic",
    "mcp[cli,srv]",
    "pydantic",
    "python-dotenv",
    "pydantic-settings>=2.15.0",
    "boto3-stubs~=1.43.98",
    "langchain-core>=1.6.3",
    "langchain-aws>=1.7.8",
    "checkpointer>=2.14.12",
    "qdrant-client[fastembed]>=1.19.1",
    "langchain-mcp-adapters>=0.3.2",
]
[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]
[project.scripts]
pycharmai = "pycharmai:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.mypy]
python_version = "3.13"
strict = true

